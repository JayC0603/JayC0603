<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <style>
  .underline { animation: accentPulse 5s ease-in-out infinite; }
  .corner { animation: cornerPulse 5s ease-in-out infinite; }
  @keyframes accentPulse { 0%,100% {opacity:.45} 50% {opacity:1;fill:#a78bfa} }
  @keyframes cornerPulse { 0%,100% {opacity:.35} 50% {opacity:.9} }
  @media (prefers-reduced-motion: reduce) { .underline,.corner {animation:none} }

    /* loopText off: text/decorations render statically. */
    .underline { transform-origin: left center; }
  </style>
  <title>Nguyen Minh Chanh — Computer Vision and Multimodal AI</title><defs>
    <linearGradient id="hdr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#hdr-bg)" rx="14" ry="14"/>

  <!-- Corner decorations: outer <g> = position, inner <g> = animation -->
  <g class="corner" opacity="0.6">
    <rect x="40" y="42" width="22" height="2" fill="#67e8f9" />
    <rect x="40" y="42" width="2" height="22" fill="#67e8f9" />
  </g>
  <g transform="translate(800 0) scale(-1 1)">
    <g class="corner" opacity="0.6">
      <rect x="40" y="42" width="22" height="2" fill="#67e8f9" />
      <rect x="40" y="42" width="2" height="22" fill="#67e8f9" />
    </g>
  </g>

  <!-- Name -->
  <text class="name" x="400" y="138" text-anchor="middle" fill="#f0f6fc" font-family='"Inter", system-ui, sans-serif' font-size="56" font-weight="700" letter-spacing="-1.5">Nguyen Minh Chanh</text>

  <!-- Accent underline -->
  <rect class="underline" x="162" y="164" width="476" height="2" fill="#67e8f9" rx="1"/>

  <!-- Meta line -->
  <text class="meta" x="400" y="200" text-anchor="middle" fill="#a5aec0" font-family="ui-monospace, monospace" font-size="13" letter-spacing="2">COMPUTER VISION &amp; MULTIMODAL AI   ·   FPT UNIVERSITY   ·   VIETNAM</text>
</svg>